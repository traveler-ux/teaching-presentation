      isRevealed = false;
      document.getElementById('ansPanel').style.display = 'none';
      document.getElementById('revealBtn').textContent = '🔍 揭曉答案';

      const isTrue = (q.ans === '真的');
      const headerEl = document.getElementById('ansHeader');
      headerEl.textContent = isTrue ? '🎉 正解是：【 ⭕ 真的 (True) 】' : '💥 正解是：【 ❌ 假的 (False) 】';
      headerEl.className = 'answer-header ' + (isTrue ? 'true' : 'false');

      document.getElementById('ansExp').textContent = '📝 學習單佐證：' + q.exp;
      document.getElementById('ansCallout').textContent = '🎤 現場連線：請【 ' + q.seat + ' ' + q.name + ' 】同學起立！跟大家分享 10 秒鐘的心情～ ✨';
    }

    function toggleTimer() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        document.getElementById('timerBtn').textContent = '⏱️ 繼續倒數';
        document.getElementById('timerDisplay').classList.remove('active');
        return;
      }
      timeLeft = 10;
      const tDisp = document.getElementById('timerDisplay');
      tDisp.textContent = timeLeft;
      tDisp.classList.add('active');
      document.getElementById('timerBtn').textContent = '⏸️ 暫停計時';
      playBeep(440, 0.1);

      timerInterval = setInterval(() => {
        timeLeft--;
        tDisp.textContent = timeLeft;
        if (timeLeft > 0) {
          playBeep(440, 0.1);
        } else {
          clearInterval(timerInterval);
          timerInterval = null;
          tDisp.textContent = '時間到！';
          document.getElementById('timerBtn').textContent = '🔔 時間到 (鎖定站位)';
          playGong();
        }
      }, 1000);
    }

    function toggleReveal() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      isRevealed = !isRevealed;
      const panel = document.getElementById('ansPanel');
      if (isRevealed) {
        panel.style.display = 'block';
        document.getElementById('revealBtn').textContent = '🙈 隱藏答案';
        playSuccess();
      } else {
        panel.style.display = 'none';
        document.getElementById('revealBtn').textContent = '🔍 揭曉答案';
      }
    }

    function prevQ() { loadQuestion(currentIndex - 1); }
    function nextQ() { loadQuestion(currentIndex + 1); }
    function pickRandom() {
      const rIdx = Math.floor(Math.random() * questions.length);
      loadQuestion(rIdx);
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (!isRevealed && !timerInterval) {
          toggleTimer();
        } else if (!isRevealed && timerInterval) {
          toggleReveal();
        } else {
          nextQ();
        }
      } else if (e.code === 'ArrowRight') {
        nextQ();
      } else if (e.code === 'ArrowLeft') {
        prevQ();
      } else if (e.code === 'KeyR') {
        pickRandom();
      }
    });

    loadQuestion(0);
  </script>
</body>
</html>
