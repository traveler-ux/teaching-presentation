<html lang="zh-TW">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080d1a;
      --bg-card: rgba(30, 41, 59, 0.88);
      --border-card: rgba(255, 255, 255, 0.12);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.4);
      --accent-gold: #fbbf24;
      --accent-coral: #fb7185;
      --accent-emerald: #34d399;
      --accent-purple: #c084fc;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-family: 'Noto Sans TC', 'Outfit', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(56, 189, 248, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 90% 85%, rgba(251, 191, 36, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(192, 132, 252, 0.08) 0%, transparent 55%);
    }

    /* Top Navigation Bar */
    header {
      padding: 0.85rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-card);
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .badge-unit {
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .topic-selector {
      display: flex;
      gap: 0.4rem;
      background: rgba(255, 255, 255, 0.06);
      padding: 0.3rem;
      border-radius: 14px;
      border: 1px solid var(--border-card);
    }

    .topic-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.45rem 0.9rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .topic-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .topic-btn.active {
      background: var(--primary);
      color: #000;
      font-weight: 800;
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .score-badge {
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 800;
    }

    /* Main Container */
    main {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-box {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 24px;
      padding: 2.2rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 45px rgba(0,0,0,0.4);
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cute Header Banner */
    .banner-cute {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-card);
      border-radius: 18px;
      padding: 1.2rem 1.6rem;
      margin-bottom: 1.5rem;
    }

    .banner-icon {
      font-size: 3.2rem;
      width: 72px;
      height: 72px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    .banner-info h2 {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .banner-info p {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* Quiz Bar & Questions */
    .quiz-status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .q-badge {
      color: var(--accent-gold);
      font-size: 1.05rem;
      font-weight: 800;
    }

    .progress-track {
      flex: 1;
      max-width: 320px;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 9999px;
      overflow: hidden;
      margin: 0 1.2rem;
    }

    .progress-bar-fill {
      height: 100%;
      width: 20%;
      background: linear-gradient(90deg, var(--primary), var(--accent-emerald));
      transition: width 0.3s ease;
    }

    .question-box {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--border-card);
      border-radius: 18px;
      padding: 1.4rem 1.8rem;
      margin-bottom: 1.5rem;
    }

    .question-title {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.6;
      color: var(--text-main);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .opt-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid var(--border-card);
      color: var(--text-main);
      padding: 1.1rem 1.4rem;
      border-radius: 16px;
      font-size: 1.12rem;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .opt-btn:hover:not(:disabled) {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--primary);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px var(--primary-glow);
    }

    .opt-btn.correct {
      background: rgba(52, 211, 153, 0.25) !important;
      border-color: var(--accent-emerald) !important;
      color: #fff !important;
    }

    .opt-btn.wrong {
      background: rgba(251, 113, 133, 0.25) !important;
      border-color: var(--accent-coral) !important;
      color: #fff !important;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .explain-card {
      display: none;
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid var(--accent-emerald);
      border-radius: 14px;
      padding: 1.1rem 1.5rem;
      margin-bottom: 1.2rem;
      font-size: 1.05rem;
      line-height: 1.55;
      color: #e2e8f0;
      animation: fadeIn 0.3s ease;
    }

    .explain-card.wrong-hint {
      background: rgba(251, 113, 133, 0.15);
      border-color: var(--accent-coral);
    }

    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-next {
      background: linear-gradient(135deg, var(--primary), #0284c7);
      color: #000;
      border: none;
      padding: 0.75rem 1.8rem;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .btn-next:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px var(--primary-glow);
    }

    /* Result View */
    .result-view {
      display: none;
      text-align: center;
      padding: 1.5rem;
    }

    .medal-icon {
      font-size: 4.5rem;
      margin-bottom: 0.75rem;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .result-title {
      font-size: 2.3rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
    }

    .result-score {
      font-size: 3rem;
      font-weight: 900;
      color: var(--accent-gold);
      margin-bottom: 0.8rem;
    }

    @media (max-width: 768px) {
      .options-grid { grid-template-columns: 1fr; }
      .topic-selector { display: none; }
    }
  </style>
</head>

  <!-- Top Header Navigation -->

  <script>
    // Web Audio Sound Synth
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playAudio(isCorrect) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (isCorrect) {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(240, audioCtx.currentTime);
        osc.frequency.setValueAtTime(180, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    let currentTopicIdx = 0;
    let currentQIdx = 0;
    let topicScore = 0;
    let answered = false;

    function selectTopic(idx) {
      currentTopicIdx = idx;
      currentQIdx = 0;
      topicScore = 0;
      answered = false;

      // Update Tab CSS
      document.querySelectorAll('.topic-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
      });

      document.getElementById('quiz-container').style.display = 'block';
      document.getElementById('result-container').style.display = 'none';

      const topic = topicsData[currentTopicIdx];
      document.getElementById('topic-icon').textContent = topic.icon;
      document.getElementById('topic-title').textContent = topic.title;
      document.getElementById('topic-desc').textContent = topic.desc;

      updateScoreBadge();
      renderQuestion();
    }

    function updateScoreBadge() {
      document.getElementById('live-score').textContent = `🏆 本章得分：${topicScore} 分`;
    }

    function renderQuestion() {
      answered = false;
      const topic = topicsData[currentTopicIdx];
      const q = topic.questions[currentQIdx];

      document.getElementById('q-number').textContent = `📌 第 ${currentQIdx + 1} / ${topic.questions.length} 題`;
      document.getElementById('progress-fill').style.width = `${((currentQIdx + 1) / topic.questions.length) * 100}%`;
      document.getElementById('question-text').innerHTML = `<span style="margin-right:0.5rem;">${q.icon}</span> ${q.q}`;

      const optsBox = document.getElementById('options-box');
      optsBox.innerHTML = '';

      q.opts.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = `<span style="color:var(--primary); font-weight:900;">${['A','B','C','D'][idx]}</span> ${optText}`;
        btn.onclick = () => handleSelectOption(idx, btn);
        optsBox.appendChild(btn);
      });

      const expBox = document.getElementById('explain-box');
      expBox.style.display = 'none';
      expBox.className = 'explain-card';
      document.getElementById('btn-next').style.display = 'none';
    }

    function handleSelectOption(selectedIdx, btnEl) {
      if (answered) return;
      answered = true;

      const topic = topicsData[currentTopicIdx];
      const q = topic.questions[currentQIdx];
      const allBtns = document.querySelectorAll('.opt-btn');
      allBtns.forEach(b => b.disabled = true);

      const expBox = document.getElementById('explain-box');

      if (selectedIdx === q.ans) {
        playAudio(true);
        btnEl.classList.add('correct');
        topicScore += 20;
        updateScoreBadge();
        expBox.innerHTML = `🌟 <strong>答對了！太棒了！</strong><br>${q.exp}`;
        expBox.classList.remove('wrong-hint');
      } else {
        playAudio(false);
        btnEl.classList.add('wrong');
        allBtns[q.ans].classList.add('correct');
        expBox.innerHTML = `💡 <strong>再想想看喔！</strong> 正確答案是【${['A','B','C','D'][q.ans]}】。<br>${q.exp}`;
        expBox.classList.add('wrong-hint');
      }

      expBox.style.display = 'block';
      document.getElementById('btn-next').style.display = 'inline-flex';
    }

    function nextQuestion() {
      const topic = topicsData[currentTopicIdx];
      currentQIdx++;
      if (currentQIdx < topic.questions.length) {
        renderQuestion();
      } else {
        showTopicResult();
      }
    }

    function showTopicResult() {
      document.getElementById('quiz-container').style.display = 'none';
      document.getElementById('result-container').style.display = 'block';

      document.getElementById('res-score').textContent = `${topicScore} 分`;
      if (topicScore === 100) {
        document.getElementById('res-title').innerHTML = `🎉 恭喜！【${topicsData[currentTopicIdx].title}】滿分通關！`;
        document.getElementById('res-desc').innerHTML = `太優秀了！你拿到了 100 分滿分！獲得「${topicsData[currentTopicIdx].icon} 專屬榮譽小博士勳章」！`;
      } else {
        document.getElementById('res-title').innerHTML = `👏 表現很棒！【${topicsData[currentTopicIdx].title}】挑戰完成！`;
        document.getElementById('res-desc').innerHTML = `獲得了 ${topicScore} 分的好成績！複習一下剛剛答錯的小提示，隨時可以重新挑戰拿滿分喔！`;
      }

      const nextTopicBtn = document.getElementById('btn-next-topic');
      if (currentTopicIdx < topicsData.length - 1) {
        nextTopicBtn.style.display = 'inline-flex';
        nextTopicBtn.textContent = `🚀 前往【${topicsData[currentTopicIdx + 1].title}】挑戰`;
      } else {
        nextTopicBtn.style.display = 'none';
      }
    }

    function restartTopic() {
      selectTopic(currentTopicIdx);
    }

    function goNextTopic() {
      if (currentTopicIdx < topicsData.length - 1) {
        selectTopic(currentTopicIdx + 1);
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // Initialize with Topic 0
    selectTopic(0);
  </script>
